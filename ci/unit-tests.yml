name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"
      - name: Install CPU test dependencies
        run: python -m pip install -e ".[graph]" sympy
      - name: Run unit and native graph tests
        run: python -m unittest discover -s tests -v

